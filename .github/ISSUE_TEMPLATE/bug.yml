name: 缺陷报告
description: 补丁没生效、误伤，或安装/卸载出问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先看 README 的「排错」一节，并附上日志的最后 30 行。

  - type: input
    id: edge-version
    attributes:
      label: Edge 版本
      description: 打开 edge://version 第一行
      placeholder: 157.0.4341.42
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows 版本
      placeholder: 10.0.19045
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 复现步骤、实际结果、期望结果
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 日志
      description: "%LOCALAPPDATA%\\StillKeep\\stillkeep.log 的最后 30 行"
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我看过 README 的「排错」
          required: true
        - label: 我运行的是最新版本
          required: true
