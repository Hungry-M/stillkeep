name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  encoding:
    name: encoding
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Script encoding and line endings
        shell: pwsh
        run: |
          $fail = 0

          Get-ChildItem -Recurse -File -Include *.cmd, *.bat | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              Write-Host "::error file=$($_.Name)::contains a UTF-8 BOM; cmd.exe does not accept it"
              $fail = 1
            }
            $text = [Text.Encoding]::ASCII.GetString($bytes)
            if ($text -match '[^\x00-\x7F]') {
              Write-Host "::error file=$($_.Name)::contains non-ASCII characters"
              $fail = 1
            }
            $lf   = ([regex]::Matches($text, "`n")).Count
            $crlf = ([regex]::Matches($text, "`r`n")).Count
            if ($lf -ne $crlf) {
              Write-Host "::error file=$($_.Name)::has LF without CR; cmd.exe misparses such files"
              $fail = 1
            }
          }

          Get-ChildItem -Recurse -File -Include *.ps1 | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $text = [Text.Encoding]::UTF8.GetString($bytes)
            if (($text -match '[^\x00-\x7F]') -and -not $hasBom) {
              Write-Host "::error file=$($_.Name)::contains non-ASCII but has no BOM; PowerShell 5.1 will read it as ANSI"
              $fail = 1
            }
          }

          if ($fail -ne 0) { exit 1 }
          Write-Host 'encoding check passed'

      - name: Version is single-sourced
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::VERSION is not semver: $version"
            exit 1
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch [regex]::Escape("## $version")) {
            Write-Host "::error::CHANGELOG.md has no entry for $version"
            exit 1
          }
          Write-Host "version $version is consistent"
